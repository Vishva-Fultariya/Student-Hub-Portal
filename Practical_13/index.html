
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management | WDF Practical 13</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1e293b;
        }

        header {
            background: #172554;
            color: white;
            padding: 24px 5%;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #dbeafe;
        }

        main {
            width: min(1100px, 92%);
            margin: 30px auto;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            align-items: start;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 14px 0 6px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font: inherit;
        }

        input:focus, select:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            font: inherit;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e2e8f0;
            color: #1e293b;
        }

        .edit {
            background: #fef3c7;
            color: #92400e;
        }

        .delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        #submitBtn {
            width: 100%;
            margin-top: 20px;
        }

        #cancelBtn {
            width: 100%;
            margin-top: 8px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .toolbar input {
            flex: 1;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #eff6ff;
            color: #1e40af;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        #message {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
        }

        #message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        #message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        #loading {
            color: #475569;
            margin-bottom: 14px;
        }

        .empty {
            color: #64748b;
            text-align: center;
            padding: 24px;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 520px) {
            .toolbar {
                flex-direction: column;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Student Management Dashboard</h1>
        <p>WDF Practical 13 — PHP JSON API & Fetch-Based CRUD</p>
    </header>

    <main>
        <div id="message" role="status" aria-live="polite"></div>

        <div class="layout">
            <section class="card" aria-labelledby="formTitle">
                <h2 id="formTitle">Add Student</h2>

                <form id="studentForm">
                    <input type="hidden" id="studentId">

                    <label for="name">Full Name</label>
                    <input type="text" id="name" maxlength="100"
                           placeholder="Enter student name" required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" maxlength="150"
                           placeholder="student@example.com" required>

                    <label for="course">Course</label>
                    <input type="text" id="course" maxlength="100"
                           placeholder="e.g. B.Tech CSE" required>

                    <label for="semester">Semester</label>
                    <select id="semester" required>
                        <option value="">Select semester</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>

                    <button type="submit" class="primary" id="submitBtn">
                        Add Student
                    </button>

                    <button type="button" class="secondary"
                            id="cancelBtn" hidden>
                        Cancel Edit
                    </button>
                </form>
            </section>

            <section class="card" aria-labelledby="listTitle">
                <h2 id="listTitle">Students Directory</h2>

                <div class="toolbar">
                    <input type="search" id="searchInput"
                           placeholder="Search by name, email or course"
                           aria-label="Search students">
                    <button type="button" class="secondary" id="refreshBtn">
                        Refresh
                    </button>
                </div>

                <p id="loading" role="status" aria-live="polite" hidden>
                    Loading students...
                </p>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Course</th>
                                <th>Semester</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentsTable">
                            <tr>
                                <td colspan="6" class="empty">
                                    Loading students...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
